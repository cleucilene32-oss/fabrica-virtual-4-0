[build]
  publish = "public"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache"
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
